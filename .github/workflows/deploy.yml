name: Déploiement GitHub Pages

on:
  push:
    branches: [claude/lum-vieux-lille-site-fczgat]
  workflow_dispatch:

# Autorise le workflow à publier sur Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois, sans annuler celui en cours
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Installation de Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configuration de Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Installation des dépendances
        run: npm ci

      - name: Build du site
        run: npm run build

      - name: Envoi de l'artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déploiement
        id: deployment
        uses: actions/deploy-pages@v4
